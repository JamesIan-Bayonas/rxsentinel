[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "rxsentinel"
version = "0.1.0"
description = "Evidence-backed medication reconciliation research prototype"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "httpx>=0.28,<1",
  "networkx>=3.4,<4",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[project.scripts]
rxsentinel-ingest = "rxsentinel.pipelines.ingest:main"
rxsentinel-readiness = "rxsentinel.pipelines.readiness:main"

[tool.hatch.build.targets.wheel]
packages = ["backend/rxsentinel"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
